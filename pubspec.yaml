name: meditation_app
description: "MVVM based meditation app"
publish_to: 'none'
version: 1.0.1+1

environment:
  sdk: '>=3.5.4 <4.0.0'
  flutter: '>=3.24.5'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.17
  go_router: ^14.6.3
  gradient_borders: ^1.0.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/
    - assets/fonts/

  fonts:
    - family: SFDisplay
      fonts:
        - asset: assets/fonts/sf_pro_display.otf
          weight: 600
